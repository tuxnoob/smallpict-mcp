name: Unpublish Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to unpublish'
        required: true
        default: '0.1.0'

jobs:
  unpublish:
    name: 🗑️ Unpublish from npm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Unpublish specified version
        run: |
          echo "Unpublishing @smallpict/mcp@${{ github.event.inputs.version }}..."
          npm unpublish "@smallpict/mcp@${{ github.event.inputs.version }}" --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Ensure latest dist-tag
        run: |
          npm dist-tag add "@smallpict/mcp@0.0.2" latest || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
